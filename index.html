<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070a12">
<meta name="description" content="VIDZ — Personal Digital Space, Web Explorer & Student.">
<title>VIDZ — Digital Space</title>

<style>

/* =========================================================
   ROOT
========================================================= */

:root{
  --bg:#070a12;
  --bg-soft:#0b101b;
  --card:rgba(15,22,36,.72);
  --card-solid:#0e1625;
  --text:#f5f7fb;
  --muted:#8491a5;
  --muted-2:#5e6b7e;
  --line:rgba(255,255,255,.08);
  --cyan:#00e5ff;
  --cyan-soft:rgba(0,229,255,.12);
  --green:#00ff9d;
  --purple:#8b5cf6;
  --shadow:0 30px 90px rgba(0,0,0,.38);
  --radius:24px;
}

body.light{
  --bg:#f3f7fb;
  --bg-soft:#eaf0f6;
  --card:rgba(255,255,255,.78);
  --card-solid:#fff;
  --text:#101827;
  --muted:#58677b;
  --muted-2:#77869a;
  --line:rgba(15,23,42,.09);
  --shadow:0 25px 70px rgba(31,41,55,.12);
}


/* =========================================================
   RESET
========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  transition:
    background .4s ease,
    color .4s ease;
}

body.no-scroll{
  overflow:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  border:0;
  font:inherit;
}

::selection{
  color:#001017;
  background:var(--cyan);
}


/* =========================================================
   LOADER
========================================================= */

.loader{
  position:fixed;
  inset:0;
  z-index:99999;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#070a12;

  transition:
    opacity .55s ease,
    visibility .55s ease;
}

.loader.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.loader-content{
  width:min(320px,80%);
  text-align:center;
}

.loader-logo{
  color:var(--cyan);
  font-size:58px;
  font-weight:950;
  letter-spacing:-6px;

  text-shadow:
    0 0 18px rgba(0,229,255,.8),
    0 0 55px rgba(0,229,255,.25);

  animation:
    loaderPulse 1.1s ease-in-out infinite alternate;
}

.loader-bar{
  height:2px;
  margin:25px 0 14px;
  overflow:hidden;
  border-radius:99px;
  background:rgba(255,255,255,.08);
}

.loader-bar::before{
  content:"";
  display:block;
  width:42%;
  height:100%;
  background:var(--cyan);
  box-shadow:0 0 18px var(--cyan);
  animation:loaderMove 1s ease-in-out infinite;
}

.loader-text{
  color:#65758b;
  font-size:9px;
  letter-spacing:3px;
}

@keyframes loaderPulse{
  to{
    transform:scale(1.045);
  }
}

@keyframes loaderMove{
  from{
    transform:translateX(-140%);
  }
  to{
    transform:translateX(330%);
  }
}


/* =========================================================
   BACKGROUND
========================================================= */

.background{
  position:fixed;
  inset:0;
  z-index:-10;
  overflow:hidden;
  pointer-events:none;

  background:
    radial-gradient(
      circle at 10% 10%,
      rgba(0,229,255,.09),
      transparent 28%
    ),
    radial-gradient(
      circle at 90% 75%,
      rgba(139,92,246,.09),
      transparent 30%
    ),
    var(--bg);
}

.grid{
  position:absolute;
  inset:-50%;

  opacity:.035;

  background-image:
    linear-gradient(
      rgba(255,255,255,.8) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.8) 1px,
      transparent 1px
    );

  background-size:65px 65px;

  transform:
    perspective(650px)
    rotateX(60deg);

  animation:gridMove 24s linear infinite;
}

.orb{
  position:absolute;

  width:380px;
  height:380px;

  border-radius:50%;

  filter:blur(110px);

  opacity:.11;

  animation:
    orbFloat 13s ease-in-out infinite alternate;
}

.orb.one{
  top:12%;
  left:-220px;
  background:var(--cyan);
}

.orb.two{
  right:-220px;
  bottom:5%;
  background:var(--purple);
  animation-delay:2s;
}

@keyframes gridMove{
  to{
    transform:
      perspective(650px)
      rotateX(60deg)
      translateY(65px);
  }
}

@keyframes orbFloat{
  to{
    transform:
      translate(100px,-70px)
      scale(1.1);
  }
}


/* =========================================================
   NAVBAR
========================================================= */

.nav-wrap{
  position:fixed;
  z-index:1000;
  top:15px;
  left:50%;
  transform:translateX(-50%);

  width:min(1120px,94%);
}

nav{
  height:64px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 12px 0 22px;

  border:1px solid var(--line);
  border-radius:20px;

  background:rgba(7,10,18,.72);

  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);

  box-shadow:
    0 15px 45px rgba(0,0,0,.18);
}

body.light nav{
  background:rgba(255,255,255,.72);
}

.logo{
  color:var(--cyan);

  font-size:25px;
  font-weight:950;
  letter-spacing:-2px;

  cursor:pointer;

  text-shadow:
    0 0 22px rgba(0,229,255,.3);

  transition:.25s;
}

.logo:hover{
  transform:translateY(-1px) scale(1.04);
}

.navlinks{
  display:flex;
  align-items:center;
  gap:3px;
}

.navlinks a{
  padding:9px 13px;

  color:var(--muted);

  border-radius:10px;

  font-size:12px;
  font-weight:600;

  transition:.25s;
}

.navlinks a:hover{
  color:var(--cyan);
  background:var(--cyan-soft);
}

.theme{
  width:38px;
  height:38px;

  margin-left:6px;

  display:grid;
  place-items:center;

  border:1px solid var(--line);
  border-radius:11px;

  background:rgba(255,255,255,.04);
  color:var(--text);

  cursor:pointer;

  transition:.25s;
}

.theme:hover{
  border-color:rgba(0,229,255,.4);
  transform:rotate(8deg);
}


/* =========================================================
   GENERAL
========================================================= */

.container{
  width:min(1120px,92%);
  margin:auto;
}

section{
  padding:110px 0;
}

.section-head{
  margin-bottom:46px;
}

.section-kicker{
  color:var(--cyan);

  font-size:10px;
  font-weight:800;

  letter-spacing:3px;
}

.section-head h2{
  margin-top:10px;

  font-size:
    clamp(34px,5vw,52px);

  line-height:1;
  letter-spacing:-3px;
}

.section-head::after{
  content:"";

  display:block;

  width:45px;
  height:2px;

  margin-top:18px;

  background:var(--cyan);

  box-shadow:
    0 0 16px rgba(0,229,255,.65);
}


/* =========================================================
   HERO
========================================================= */

.hero{
  min-height:100vh;

  display:grid;
  grid-template-columns:1.12fr .88fr;

  align-items:center;

  gap:80px;

  padding:
    155px 0
    90px;
}

.status{
  width:max-content;

  display:flex;
  align-items:center;
  gap:9px;

  padding:8px 13px;

  border:
    1px solid rgba(0,229,255,.2);

  border-radius:999px;

  background:rgba(0,229,255,.055);

  color:#8293a8;

  font-size:9px;
  font-weight:700;

  letter-spacing:1.5px;
}

.status i{
  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--green);

  box-shadow:
    0 0 12px var(--green);

  animation:statusPulse 1.6s infinite;
}

@keyframes statusPulse{
  50%{
    opacity:.35;
    transform:scale(.7);
  }
}

.hero h1{
  margin-top:26px;

  font-size:
    clamp(65px,9vw,112px);

  line-height:.83;

  letter-spacing:-8px;

  font-weight:950;
}

.hero h1 span{
  color:var(--cyan);

  text-shadow:
    0 0 45px rgba(0,229,255,.28);
}

.hero-sub{
  max-width:640px;

  margin-top:30px;

  color:var(--muted);

  font-size:15px;

  line-height:1.9;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;

  margin-top:32px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  min-height:46px;

  padding:0 18px;

  border-radius:12px;

  font-size:12px;
  font-weight:800;

  transition:
    transform .25s,
    box-shadow .25s,
    border-color .25s;
}

.btn:hover{
  transform:translateY(-4px);
}

.primary{
  color:#001017;
  background:var(--cyan);

  box-shadow:
    0 12px 35px rgba(0,229,255,.16);
}

.primary:hover{
  box-shadow:
    0 16px 45px rgba(0,229,255,.25);
}

.secondary{
  border:1px solid var(--line);
  background:rgba(255,255,255,.035);
  color:var(--text);
}


/* =========================================================
   PROFILE CARD
========================================================= */

.profile-card{
  position:relative;

  padding:28px;

  overflow:hidden;

  border:
    1px solid rgba(0,229,255,.16);

  border-radius:28px;

  background:
    linear-gradient(
      145deg,
      rgba(17,27,48,.78),
      rgba(8,13,24,.78)
    );

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  box-shadow:var(--shadow);

  transition:.35s;
}

body.light .profile-card{
  background:rgba(255,255,255,.75);
}

.profile-card:hover{
  transform:translateY(-7px);

  border-color:
    rgba(0,229,255,.32);
}

.profile-card::before{
  content:"";

  position:absolute;

  width:220px;
  height:220px;

  top:-120px;
  right:-100px;

  border-radius:50%;

  background:var(--cyan);

  filter:blur(90px);

  opacity:.11;
}

.profile-top{
  display:flex;
  justify-content:space-between;

  margin-bottom:24px;

  color:var(--muted-2);

  font-size:8px;
  font-weight:800;

  letter-spacing:2px;
}

.profile-top span:last-child{
  color:var(--green);
}

.avatar{
  display:block;

  width:145px;
  height:145px;

  margin:0 auto 21px;

  object-fit:cover;

  border:
    2px solid var(--cyan);

  border-radius:50%;

  box-shadow:
    0 0 28px rgba(0,229,255,.35),
    0 0 80px rgba(0,229,255,.09);

  animation:avatarFloat 4s ease-in-out infinite;
}

@keyframes avatarFloat{
  50%{
    transform:translateY(-7px);
  }
}

.profile-card h3{
  text-align:center;

  font-size:27px;
  letter-spacing:-1px;
}

.role{
  margin-top:6px;

  text-align:center;

  color:var(--cyan);

  font-size:11px;
  font-weight:700;
}

.divider{
  height:1px;

  margin:23px 0;

  background:var(--line);
}

.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.info{
  padding:13px;

  border:
    1px solid var(--line);

  border-radius:13px;

  background:rgba(255,255,255,.025);
}

.info small{
  display:block;

  margin-bottom:5px;

  color:var(--muted-2);

  font-size:8px;
  font-weight:700;

  text-transform:uppercase;
  letter-spacing:1px;
}

.info b{
  font-size:11px;
}

.quote{
  margin-top:13px;

  padding:14px;

  border-left:
    2px solid var(--cyan);

  border-radius:
    0 12px 12px 0;

  background:rgba(255,255,255,.025);

  color:var(--muted);

  font-size:11px;

  line-height:1.7;
}


/* =========================================================
   STATS
========================================================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.stat{
  position:relative;

  min-height:160px;

  padding:27px;

  overflow:hidden;

  border:
    1px solid var(--line);

  border-radius:20px;

  background:var(--card);

  backdrop-filter:blur(14px);

  transition:.3s;
}

.stat:hover{
  transform:translateY(-7px);

  border-color:
    rgba(0,229,255,.28);
}

.stat strong{
  display:block;

  color:var(--cyan);

  font-size:43px;
  letter-spacing:-3px;
}

.stat span{
  display:block;

  margin-top:12px;

  color:var(--muted);

  font-size:11px;
}


/* =========================================================
   ABOUT
========================================================= */

.about{
  padding:42px;

  border:
    1px solid var(--line);

  border-radius:24px;

  background:var(--card);

  backdrop-filter:blur(15px);

  box-shadow:
    0 20px 70px rgba(0,0,0,.12);
}

.about p{
  max-width:850px;
  margin:auto;

  color:var(--muted);

  text-align:center;

  font-size:15px;

  line-height:2;
}


/* =========================================================
   SKILLS
========================================================= */

.skills{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:13px;
}

.skill{
  padding:22px;

  border:
    1px solid var(--line);

  border-radius:17px;

  background:var(--card);

  transition:.3s;
}

.skill:hover{
  transform:translateY(-5px);

  border-color:
    rgba(0,229,255,.28);
}

.skill b{
  display:block;

  margin-bottom:7px;

  font-size:13px;
}

.skill span{
  color:var(--muted);

  font-size:11px;
}


/* =========================================================
   PROJECTS
========================================================= */

.projects{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:16px;
}

.project{
  position:relative;

  min-height:260px;

  padding:27px;

  overflow:hidden;

  border:
    1px solid var(--line);

  border-radius:22px;

  background:var(--card);

  transition:.35s;
}

.project:hover{
  transform:translateY(-8px);

  border-color:
    rgba(0,229,255,.3);

  box-shadow:
    0 25px 65px rgba(0,0,0,.22);
}

.project-number{
  position:absolute;

  top:22px;
  right:23px;

  color:var(--muted-2);

  font-size:9px;
  font-weight:800;

  letter-spacing:1px;
}

.project-icon{
  width:54px;
  height:54px;

  display:grid;
  place-items:center;

  margin-bottom:23px;

  border:
    1px solid var(--line);

  border-radius:15px;

  background:rgba(255,255,255,.035);

  font-size:25px;
}

.project h3{
  margin-bottom:10px;

  font-size:19px;
  letter-spacing:-.5px;
}

.project p{
  color:var(--muted);

  font-size:12px;

  line-height:1.8;
}

.project-arrow{
  position:absolute;

  right:25px;
  bottom:22px;

  color:var(--cyan);

  font-size:20px;

  opacity:.45;

  transition:.3s;
}

.project:hover .project-arrow{
  opacity:1;
  transform:translateX(5px);
}


/* =========================================================
   TIMELINE
========================================================= */

.timeline{
  position:relative;

  max-width:850px;

  margin:auto;
}

.timeline::before{
  content:"";

  position:absolute;

  left:20px;
  top:20px;
  bottom:20px;

  width:1px;

  background:
    linear-gradient(
      var(--cyan),
      var(--line),
      var(--purple)
    );
}

.event{
  position:relative;

  display:flex;

  gap:18px;

  padding:
    12px 0
    24px;
}

.event-number{
  position:relative;
  z-index:2;

  flex:none;

  width:41px;
  height:41px;

  display:grid;
  place-items:center;

  border-radius:50%;

  background:var(--cyan);

  color:#001017;

  font-size:10px;
  font-weight:900;

  box-shadow:
    0 0 0 7px var(--bg),
    0 0 22px rgba(0,229,255,.25);
}

.event-card{
  flex:1;

  padding:18px;

  border:
    1px solid var(--line);

  border-radius:15px;

  background:var(--card);

  transition:.3s;
}

.event-card:hover{
  transform:translateX(5px);

  border-color:
    rgba(0,229,255,.22);
}

.event-card h3{
  margin-bottom:7px;

  font-size:14px;
}

.event-card p{
  color:var(--muted);

  font-size:12px;

  line-height:1.7;
}


/* =========================================================
   FOOTER
========================================================= */

footer{
  padding:
    45px 20px
    35px;

  border-top:
    1px solid var(--line);

  color:var(--muted-2);

  text-align:center;

  font-size:11px;
}

footer span{
  color:var(--cyan);
}


/* =========================================================
   REVEAL
========================================================= */

.reveal{
  opacity:0;

  transform:translateY(25px);

  transition:
    opacity .7s ease,
    transform .7s ease;
}

.reveal.show{
  opacity:1;

  transform:translateY(0);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:850px){

  .hero{
    grid-template-columns:1fr;

    gap:55px;

    text-align:center;

    padding:
      140px 0
      80px;
  }

  .status{
    margin:auto;
  }

  .hero-sub{
    margin-left:auto;
    margin-right:auto;
  }

  .actions{
    justify-content:center;
  }

  .profile-card{
    max-width:570px;
    margin:auto;

    text-align:left;
  }

  .stats,
  .skills,
  .projects{
    grid-template-columns:1fr;
  }

  section{
    padding:80px 0;
  }

}


/* =========================================================
   SMALL PHONE
========================================================= */

@media(max-width:500px){

  .nav-wrap{
    top:9px;
    width:94%;
  }

  nav{
    height:57px;

    padding-left:17px;

    border-radius:17px;
  }

  .navlinks a{
    display:none;
  }

  .theme{
    margin-left:3px;
  }

  .hero{
    padding-top:125px;
  }

  .hero h1{
    font-size:58px;

    letter-spacing:-5px;
  }

  .hero-sub{
    font-size:13px;
  }

  .profile-card{
    padding:23px;
  }

  .info-grid{
    grid-template-columns:1fr;
  }

  .about{
    padding:27px 20px;
  }

  .about p{
    font-size:13px;
  }

  .section-head h2{
    font-size:36px;
  }

  .timeline::before{
    left:19px;
  }

  .event-number{
    width:38px;
    height:38px;
  }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    scroll-behavior:auto !important;
    transition-duration:.01ms !important;
  }

}

</style>
</head>


<body class="no-scroll">

     LOADER
======================================================== -->

  <div class="loader-content">

    <div class="loader-logo">

    </div>

    <div class="loader-bar"></div>

    </div>

  </div>

</div>


<!-- =======================================================
     BACKGROUND
======================================================== -->

<div class="background">

  <div class="grid"></div>

  <div class="orb one"></div>

  <div class="orb two"></div>

</div>


<!-- =======================================================
     NAVBAR
======================================================== -->

<div class="nav-wrap">

<nav>

  <div
    class="logo"
    id="logo">

    VIDZ.

  </div>


  <div class="navlinks">

    <a href="#home">
      Home
    </a>

    <a href="#about">
      Tentang
    </a>

    <a href="#skills">
      Skills
    </a>

    <a href="#projects">
      Project
    </a>

    <button
      class="theme"
      id="themeButton"
      aria-label="Ganti tema">

      🌙

    </button>

  </div>

</nav>

</div>


<!-- =======================================================
     HERO
======================================================== -->

<main>

<section
  class="hero container"
  id="home">


  <div class="reveal">

    <div class="status">

      <i></i>

      CURRENTLY LEARNING WEB DEVELOPMENT

    </div>


    <h1>

      HALO,<br>

      SAYA
      <span>VIDZ.</span>

    </h1>

    </p>


    <div class="actions">

      <a
        class="btn primary"
        href="#projects">

        Lihat Project →

      </a>


      <a
        class="btn secondary"
        href="#about">

        Tentang Saya

      </a>

    </div>

  </div>


  <!-- PROFILE -->

  <div class="profile-card reveal">

    <div class="profile-top">

      <span>
